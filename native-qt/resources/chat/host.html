<!doctype html><meta charset="utf-8"><title>Engine spike host feed</title>
<style>iframe{display:none}</style>
<body>
<script>
const params=new URLSearchParams(location.search), session=params.get('session');
const frame=document.createElement('iframe');
frame.src='https://vdo.socialstream.ninja/?room='+encodeURIComponent(session)+'&password=false&label=dock&push=engine-spike-host&view='+encodeURIComponent(session);
document.body.append(frame);
window.feed=[];window.peers={};
addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const p=e.data;
  if(p.action?.endsWith('connection-info'))peers[p.UUID]=p.value.label;
  if(p.action?.endsWith('connection') && p.value===false)delete peers[p.UUID];
  if(p.dataReceived && 'overlayNinja' in p.dataReceived){
    const m=p.dataReceived.overlayNinja;
    if(m && typeof m.chatmessage==='string') {
      const text=s=>{
        const value=String(s||'');
        if(!/[<&]/.test(value))return value;
        const doc=new DOMParser().parseFromString(value,'text/html');
        // SSN represents emotes as images. Preserve their accessible text when
        // converting the rich message into Studio's plain-text comment model.
        for(const img of doc.querySelectorAll('img'))img.replaceWith(doc.createTextNode(img.getAttribute('alt')||''));
        for(const br of doc.querySelectorAll('br'))br.replaceWith(doc.createTextNode('\n'));
        return doc.body.textContent;
      };
      const event=typeof m.event==='string'?m.event:'';
      const donation=text(m.hasDonation),membership=text(m.membership);
      let body=m.textonly?m.chatmessage:text(m.chatmessage);
      if(!body.trim()&&(donation||membership||event.includes('gift')))body=event.includes('gift')?'Sent a gift':membership?'Membership update':'Sent a donation';
      const comment={id:m.id,tid:m.tid,type:m.type,
        chatname:text(m.chatname),chatmessage:body,
        hasDonation:donation,membership,event,meta:m.meta||{},textonly:true};
      window.__engineSpike.rpc('host.comment',[comment]).catch(()=>{});
      // Retain a bounded plain-text diagnostic feed, not raw platform payloads
      // and another serialized DOM copy for a page that is never displayed.
      feed.push(comment);if(feed.length>100)feed.shift();
    }
  }
});
window.feature=(data,uuid)=>frame.contentWindow.postMessage({sendData:{overlayNinja:data},type:'pcs',UUID:uuid},'https://vdo.socialstream.ninja');
window.engineCommand=data=>frame.contentWindow.postMessage({sendData:{overlayNinja:data},type:'rpcs'},'https://vdo.socialstream.ninja');
</script>
