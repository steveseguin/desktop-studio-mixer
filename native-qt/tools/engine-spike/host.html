<!doctype html><meta charset="utf-8"><title>Engine spike host feed</title>
<style>body{font:16px system-ui;background:#18202b;color:#eee}pre{white-space:pre-wrap}iframe{display:none}</style>
<h1>Processed host feed</h1><div id="feed"></div><pre id="state"></pre><pre id="debugger"></pre>
<script>
const params=new URLSearchParams(location.search), session=params.get('session');
const frame=document.createElement('iframe');
frame.src='https://vdo.socialstream.ninja/?room='+encodeURIComponent(session)+'&password=false&label=dock&push=engine-spike-host&view='+encodeURIComponent(session);
document.body.append(frame);
window.feed=[];window.peers={};
addEventListener('host.debugger',e=>document.querySelector('#debugger').textContent+=JSON.stringify(e.detail[0])+'\n');
addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const p=e.data;
  if(p.action?.endsWith('connection-info'))peers[p.UUID]=p.value.label;
  if(p.action?.endsWith('connection') && p.value===false)delete peers[p.UUID];
  if(p.dataReceived && 'overlayNinja' in p.dataReceived){
    feed.push(p.dataReceived.overlayNinja);
    const row=document.createElement('pre');row.textContent=JSON.stringify(p.dataReceived.overlayNinja);document.querySelector('#feed').append(row);
  }
});
window.feature=(data,uuid)=>frame.contentWindow.postMessage({sendData:{overlayNinja:data},type:'pcs',UUID:uuid},'https://vdo.socialstream.ninja');
window.engineCommand=data=>frame.contentWindow.postMessage({sendData:{overlayNinja:data},type:'rpcs'},'https://vdo.socialstream.ninja');
</script>
